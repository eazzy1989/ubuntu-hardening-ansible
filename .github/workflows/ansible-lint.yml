name: Ansible prüfen

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Ansible installieren
        run: |
          pip install ansible-core ansible-lint
          ansible-galaxy collection install -r requirements.yml

      - name: Syntax prüfen
        run: ansible-playbook -i inventory.example.ini site.yml --syntax-check

      - name: ansible-lint
        run: ansible-lint --profile moderate site.yml
